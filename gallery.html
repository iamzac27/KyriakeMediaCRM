<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; background: #fff; color: #111; }
  .hidden { display: none !important; }

  #topbar { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 14px 22px; border-bottom: 1px solid rgba(17,17,17,.11); }
  #topbar a { text-decoration: none; color: #111; font-size: 12.5px; font-weight: 600; letter-spacing: .1em; flex: none; }
  #staffBar { display: none; align-items: center; gap: 14px; font-size: 12px; color: #6f6c66; flex: none; }
  #staffBar button { border: 1px solid rgba(17,17,17,.3); background: #fff; cursor: pointer; font: inherit; font-size: 11px; font-weight: 600; letter-spacing: .08em; padding: 8px 12px; }
  #staffBar button:hover { background: #111; color: #fff; }

  #state-loading, #state-notfound { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #6f6c66; text-align: center; padding: 20px; }

  #page { flex: 1; display: flex; flex-direction: column; min-height: 0; }

  /* cover landing */
  #cover { position: relative; flex: 1; min-height: 480px; overflow: hidden; background: #111; }
  #cover img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: .92; }
  #cover .scrim { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,.15), rgba(0,0,0,.1) 40%, rgba(0,0,0,.65)); }
  #cover .content { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: #fff; padding: 24px; gap: 26px; }
  #cover .address { font-family: 'Playfair Display', Georgia, serif; font-size: clamp(26px, 5vw, 52px); letter-spacing: .04em; font-weight: 500; text-transform: uppercase; text-shadow: 0 2px 18px rgba(0,0,0,.35); max-width: 900px; }
  #cover .meta { font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: rgba(255,255,255,.85); }
  #cover .viewBtn { border: 1.5px solid #fff; background: rgba(255,255,255,.06); color: #fff; cursor: pointer; font: inherit; font-size: 12.5px; font-weight: 600; letter-spacing: .2em; padding: 15px 40px; backdrop-filter: blur(2px); }
  #cover .viewBtn:hover { background: #fff; color: #111; }
  #cover .wordmark { position: absolute; left: 0; right: 0; bottom: 28px; text-align: center; font-size: 11px; letter-spacing: .32em; color: rgba(255,255,255,.92); font-weight: 500; }
  #cover .unpub { position: absolute; top: 16px; left: 16px; background: #b3452f; color: #fff; font-size: 11px; font-weight: 600; letter-spacing: .08em; padding: 6px 12px; }

  /* full gallery */
  #full { display: none; }
  #full .headerRow { position: relative; padding: 26px 22px 10px; text-align: center; }
  #full .headerRow .eyebrow { font-size: 10px; letter-spacing: .2em; color: #8d8a83; font-weight: 500; }
  #full .headerRow .addr { font-family: 'Playfair Display', Georgia, serif; font-size: 24px; font-weight: 500; margin-top: 2px; }
  #full .headerRow .sub { font-size: 12px; color: #6f6c66; margin-top: 4px; }
  #downloadAllBtn { display: none; margin: 12px auto 0; border: 0; background: none; cursor: pointer; font: inherit; font-size: 11.5px; letter-spacing: .1em; color: #6f6c66; text-decoration: underline; }
  #downloadAllBtn:hover { color: #111; }

  #tabBar { display: none; align-items: center; justify-content: center; gap: 2px; flex-wrap: wrap; flex: 1; min-width: 0; }
  .tabBtn { display: flex; align-items: center; gap: 7px; border: 0; cursor: pointer; white-space: nowrap; border-radius: 22px; padding: 7px 13px; font: inherit; font-size: 10.5px; font-weight: 500; letter-spacing: .15em; background: transparent; color: #3a3833; }
  .tabBtn.on { background: #e6e3dc; color: #111; }
  .tabBtn .tabCount { font-size: 9.5px; letter-spacing: .04em; font-family: 'IBM Plex Mono', monospace; color: #6f6c66; background: rgba(17,17,17,.06); padding: 2px 5px; border-radius: 4px; }
  .tabBtn.on .tabCount { background: #f4f2ee; }

  #messagesPane { max-width: 560px; margin: 0 auto; padding: 10px 22px 70px; }
  #messagesPane .msgEmpty { text-align: center; color: #6f6c66; font-size: 13px; padding: 20px 0; }
  #messagesLog { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; max-height: 50vh; overflow-y: auto; }
  .msgRow { font-size: 13px; padding: 10px 12px; border-radius: 8px; background: #f4f2ee; }
  .msgRow.staff { background: #e9f1ea; }
  .msgRow .who { font-size: 10.5px; font-weight: 600; letter-spacing: .06em; color: #6f6c66; margin-bottom: 3px; }
  .msgRow .txt { color: #111; white-space: pre-wrap; }
  #messagesForm { display: flex; gap: 8px; }
  #messagesForm input[type=text] { flex: 1; border: 1px solid rgba(17,17,17,.18); padding: 10px 12px; font: inherit; font-size: 13px; }
  #messagesForm button { border: 0; background: #2f5f47; color: #fff; cursor: pointer; font: inherit; font-size: 12px; font-weight: 600; letter-spacing: .06em; padding: 10px 16px; }
  #messagesNameRow { display: flex; gap: 8px; margin-bottom: 10px; }
  #messagesNameRow input { flex: 1; border: 1px solid rgba(17,17,17,.18); padding: 9px 12px; font: inherit; font-size: 12.5px; }

  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(390px, 1fr)); gap: 6px; padding: 0 6px 60px; }
  #grid .cell { position: relative; aspect-ratio: 4/3; overflow: hidden; background: #f1efe9; cursor: pointer; }
  #grid .cell img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #grid .cell .coverTag { position: absolute; top: 8px; left: 8px; background: rgba(17,17,17,.75); color: #fff; font-size: 9.5px; letter-spacing: .1em; padding: 4px 8px; }
  #grid .cell .setCoverBtn { position: absolute; bottom: 8px; right: 8px; border: 0; background: rgba(255,255,255,.92); cursor: pointer; font: inherit; font-size: 10px; font-weight: 600; letter-spacing: .06em; padding: 6px 9px; display: none; }
  #grid .cell:hover .setCoverBtn { display: block; }
  #empty { text-align: center; color: #6f6c66; font-size: 13px; padding: 40px 20px 70px; }

  #uploadBar { display: none; align-items: center; justify-content: center; gap: 14px; padding: 14px 22px; border-top: 1px solid rgba(17,17,17,.11); background: #faf9f5; position: sticky; bottom: 0; flex-wrap: wrap; }
  #uploadBar label { border: 1px solid rgba(17,17,17,.3); background: #2f5f47; color: #fff; cursor: pointer; font-size: 11.5px; font-weight: 600; letter-spacing: .1em; padding: 12px 20px; }
  #uploadBar label:hover { background: #25503b; }
  #uploadBar input[type=file] { display: none; }
  #uploadStatus { font-size: 12px; color: #6f6c66; }
  #publishToggle { border: 1px solid rgba(17,17,17,.3); background: #fff; cursor: pointer; font: inherit; font-size: 11.5px; font-weight: 600; letter-spacing: .08em; padding: 12px 18px; }

  /* lightbox */
  #lightbox { display: none; position: fixed; inset: 0; z-index: 999; background: rgba(10,10,10,.96); flex-direction: column; align-items: center; justify-content: center; }
  #lightbox.open { display: flex; }
  #lbImgWrap { position: relative; flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; padding: 60px 70px 0; min-height: 0; }
  #lbImg { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
  #lbClose { position: absolute; top: 18px; right: 22px; border: 0; background: none; cursor: pointer; color: #fff; font-size: 26px; line-height: 1; }
  #lbPrev, #lbNext { position: absolute; top: 50%; transform: translateY(-50%); border: 0; background: rgba(255,255,255,.1); color: #fff; cursor: pointer; font-size: 26px; width: 46px; height: 46px; border-radius: 50%; }
  #lbPrev:hover, #lbNext:hover { background: rgba(255,255,255,.22); }
  #lbPrev { left: 14px; }
  #lbNext { right: 14px; }
  #lbActions { flex: none; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; padding: 16px 22px 26px; }
  #lbActions button { border: 1px solid rgba(255,255,255,.5); background: transparent; color: #fff; cursor: pointer; font: inherit; font-size: 11px; font-weight: 600; letter-spacing: .12em; padding: 11px 18px; }
  #lbActions button:hover { background: #fff; color: #111; }
  #lbStatus { flex: none; color: rgba(255,255,255,.75); font-size: 11.5px; padding-bottom: 14px; min-height: 14px; }
</style>
</head>
<body>

<div id="topbar">
  <a href="./index.html">KYRIAKE MEDIA</a>
  <div id="tabBar"></div>
  <div id="staffBar">
    <span id="staffEmail"></span>
    <button id="logoutBtn">Log out</button>
  </div>
</div>

<div id="state-loading">Loading gallery…</div>

<div id="state-notfound" class="hidden">
  This gallery link isn't valid, or the gallery hasn't been published yet.<br>
  Ask your photographer for the correct link.
</div>

<div id="page" class="hidden">
  <div id="cover">
    <div id="unpubBadge" class="unpub hidden">UNPUBLISHED — only visible to staff</div>
    <img id="coverImg" src="" alt="">
    <div class="scrim"></div>
    <div class="content">
      <div class="address" id="addressText"></div>
      <div class="meta" id="metaText"></div>
      <button class="viewBtn" id="viewGalleryBtn">VIEW GALLERY</button>
    </div>
    <div class="wordmark">KYRIAKE MEDIA</div>
  </div>

  <div id="full">
    <div class="headerRow">
      <div class="eyebrow">CLIENT GALLERY</div>
      <div class="addr" id="fullAddress"></div>
      <div class="sub" id="fullMeta"></div>
      <button id="downloadAllBtn">DOWNLOAD ALL</button>
    </div>
    <div id="grid"></div>
    <div id="empty" class="hidden">No photos uploaded yet.</div>
    <div id="messagesPane" class="hidden">
      <div id="messagesNameRow" class="hidden">
        <input type="text" id="messagesName" placeholder="Your name">
      </div>
      <div id="messagesLog"></div>
      <div id="messagesEmpty" class="msgEmpty hidden">No messages yet.</div>
      <form id="messagesForm">
        <input type="text" id="messagesInput" placeholder="Message the studio…" autocomplete="off">
        <button type="submit">SEND</button>
      </form>
    </div>
  </div>

  <div id="uploadBar">
    <label>UPLOAD PHOTOS<input type="file" id="fileInput" accept="image/*" multiple></label>
    <button id="publishToggle"></button>
    <span id="uploadStatus"></span>
  </div>
</div>

<div id="lightbox">
  <button id="lbClose">✕</button>
  <button id="lbPrev">‹</button>
  <div id="lbImgWrap"><img id="lbImg" src="" alt=""></div>
  <button id="lbNext">›</button>
  <div id="lbActions">
    <button id="lbDownloadFull">DOWNLOAD FULL SIZE</button>
    <button id="lbDownload8">DOWNLOAD 8 MB</button>
  </div>
  <div id="lbStatus"></div>
</div>

<script>
(function () {
  var SB_URL = "https://igihkpzxcxcjdjnghvdk.supabase.co";
  var SB_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlnaWhrcHp4Y3hjamRqbmdodmRrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4NTY2NzQsImV4cCI6MjEwNDQzMjY3NH0.wKekwGnt7VzvEUuuWV2WWd-nRxHm50wHHcRrzZccWfE";

  var params = new URLSearchParams(location.search);
  var slug = (params.get("slug") || "").trim();

  var accessToken = null, isStaff = false, staffEmail = null;
  try {
    accessToken = localStorage.getItem("kyriake_sb_access_token");
    isStaff = localStorage.getItem("kyriake_sb_is_staff") === "true";
    staffEmail = localStorage.getItem("kyriake_sb_user_email");
  } catch (_) {}

  var authHeaders = {
    apikey: SB_ANON_KEY,
    Authorization: "Bearer " + (isStaff && accessToken ? accessToken : SB_ANON_KEY)
  };

  async function refreshSbSession() {
    var refreshToken = "";
    try { refreshToken = localStorage.getItem("kyriake_sb_refresh_token") || ""; } catch (_) {}
    if (!refreshToken) return false;
    try {
      var res = await fetch(SB_URL + "/auth/v1/token?grant_type=refresh_token", {
        method: "POST",
        headers: { "Content-Type": "application/json", apikey: SB_ANON_KEY },
        body: JSON.stringify({ refresh_token: refreshToken })
      });
      var data = await res.json();
      if (!res.ok || !data.access_token) return false;
      accessToken = data.access_token;
      try {
        localStorage.setItem("kyriake_sb_access_token", data.access_token);
        if (data.refresh_token) localStorage.setItem("kyriake_sb_refresh_token", data.refresh_token);
      } catch (_) {}
      authHeaders = { apikey: SB_ANON_KEY, Authorization: "Bearer " + accessToken };
      return true;
    } catch (e) {
      return false;
    }
  }

  var galleryRow = null;
  var photos = [];
  var messages = [];
  var lbIndex = -1;

  var TABS = [
    { key: "FULL", label: "FULL SIZE" },
    { key: "8MB", label: "8 MB" },
    { key: "FLOOR", label: "FLOOR PLANS" },
    { key: "VIDEO", label: "VIDEO" },
    { key: "MESSAGES", label: "MESSAGES" }
  ];
  var currentTab = "FULL";

  function el(id) { return document.getElementById(id); }

  function showState(name) {
    el("state-loading").classList.toggle("hidden", name !== "loading");
    el("state-notfound").classList.toggle("hidden", name !== "notfound");
    el("page").classList.toggle("hidden", name !== "page");
  }

  function renderStaffBar() {
    if (isStaff && staffEmail) {
      el("staffBar").style.display = "flex";
      el("staffEmail").textContent = staffEmail;
    }
  }

  function renderCover() {
    el("addressText").textContent = galleryRow.address || "";
    var metaParts = [];
    if (galleryRow.agent_name) metaParts.push(galleryRow.agent_name);
    if (galleryRow.agency) metaParts.push(galleryRow.agency);
    el("metaText").textContent = metaParts.join(" · ");
    el("coverImg").src = galleryRow.cover_photo_url || (photos[0] ? photos[0].url : "");
    el("unpubBadge").classList.toggle("hidden", !!galleryRow.published);
    el("fullAddress").textContent = galleryRow.address || "";
    el("fullMeta").textContent = metaParts.join(" · ");
  }

  function tabCount(key) {
    return (key === "FULL" || key === "8MB") ? String(photos.length) : "";
  }

  function renderTabs() {
    var bar = el("tabBar");
    bar.innerHTML = "";
    TABS.forEach(function (t) {
      var on = t.key === currentTab;
      var btn = document.createElement("button");
      btn.className = "tabBtn" + (on ? " on" : "");
      btn.appendChild(document.createTextNode(t.label));
      var count = tabCount(t.key);
      if (count) {
        var span = document.createElement("span");
        span.className = "tabCount";
        span.textContent = count;
        btn.appendChild(span);
      }
      btn.onclick = function () {
        currentTab = t.key;
        renderTabs();
        renderGrid();
        renderStaffControls();
        if (t.key === "MESSAGES") loadMessages();
      };
      bar.appendChild(btn);
    });
  }

  function renderGrid() {
    var grid = el("grid");
    var emptyEl = el("empty");
    var messagesEl = el("messagesPane");
    var downloadAllBtn = el("downloadAllBtn");
    grid.innerHTML = "";

    if (currentTab === "MESSAGES") {
      grid.classList.add("hidden");
      emptyEl.classList.add("hidden");
      messagesEl.classList.remove("hidden");
      downloadAllBtn.style.display = "none";
      return;
    }
    messagesEl.classList.add("hidden");
    grid.classList.remove("hidden");

    if (currentTab === "FLOOR") {
      emptyEl.textContent = "No floor plans uploaded yet.";
      emptyEl.classList.remove("hidden");
      downloadAllBtn.style.display = "none";
      return;
    }
    if (currentTab === "VIDEO") {
      emptyEl.textContent = "No video uploaded yet.";
      emptyEl.classList.remove("hidden");
      downloadAllBtn.style.display = "none";
      return;
    }

    emptyEl.textContent = "No photos uploaded yet.";
    emptyEl.classList.toggle("hidden", photos.length > 0);
    downloadAllBtn.style.display = photos.length > 0 ? "block" : "none";
    photos.forEach(function (p, idx) {
      var cell = document.createElement("div");
      cell.className = "cell";
      var img = document.createElement("img");
      img.src = p.url;
      cell.appendChild(img);
      if (galleryRow.cover_photo_url === p.url) {
        var tag = document.createElement("div");
        tag.className = "coverTag";
        tag.textContent = "COVER";
        cell.appendChild(tag);
      }
      if (isStaff) {
        var btn = document.createElement("button");
        btn.className = "setCoverBtn";
        btn.textContent = "SET AS COVER";
        btn.onclick = function (e) { e.stopPropagation(); setCoverPhoto(p.url); };
        cell.appendChild(btn);
      }
      cell.onclick = function () { openLightbox(idx); };
      grid.appendChild(cell);
    });
  }

  function renderStaffControls() {
    if (!isStaff) return;
    var showUpload = currentTab === "FULL" || currentTab === "8MB";
    el("uploadBar").style.display = showUpload ? "flex" : "none";
    var pub = el("publishToggle");
    pub.textContent = galleryRow.published ? "UNPUBLISH" : "PUBLISH";
    pub.onclick = togglePublish;
  }

  async function fetchGallery() {
    var res = await fetch(SB_URL + "/rest/v1/galleries?slug=eq." + encodeURIComponent(slug) + "&select=*", {
      headers: authHeaders
    });
    if (res.status === 401 && isStaff && await refreshSbSession()) {
      res = await fetch(SB_URL + "/rest/v1/galleries?slug=eq." + encodeURIComponent(slug) + "&select=*", {
        headers: authHeaders
      });
    }
    var rows = await res.json();
    if (!res.ok || !rows || !rows.length) { showState("notfound"); return; }
    galleryRow = rows[0];
    var pres = await fetch(SB_URL + "/rest/v1/gallery_photos?gallery_id=eq." + galleryRow.id + "&select=*&order=sort_order.asc", {
      headers: authHeaders
    });
    photos = pres.ok ? await pres.json() : [];
    renderCover();
    renderTabs();
    renderGrid();
    renderStaffControls();
    renderStaffBar();
    showState("page");
  }

  el("viewGalleryBtn").onclick = function () {
    el("cover").style.display = "none";
    el("full").style.display = "block";
    el("tabBar").style.display = "flex";
  };

  var logoutBtn = el("logoutBtn");
  if (logoutBtn) logoutBtn.onclick = function () {
    try {
      localStorage.removeItem("kyriake_sb_access_token");
      localStorage.removeItem("kyriake_sb_refresh_token");
      localStorage.removeItem("kyriake_sb_user_email");
      localStorage.removeItem("kyriake_sb_is_staff");
    } catch (_) {}
    location.reload();
  };

  async function togglePublish() {
    var next = !galleryRow.published;
    el("uploadStatus").textContent = "Saving…";
    var res = await fetch(SB_URL + "/rest/v1/galleries?id=eq." + galleryRow.id, {
      method: "PATCH",
      headers: Object.assign({ "Content-Type": "application/json", Prefer: "return=representation" }, authHeaders),
      body: JSON.stringify({ published: next })
    });
    if (res.ok) {
      galleryRow.published = next;
      renderCover();
      renderStaffControls();
      el("uploadStatus").textContent = "Saved.";
    } else {
      el("uploadStatus").textContent = "Could not update. Try logging in again.";
    }
  }

  async function setCoverPhoto(url) {
    el("uploadStatus").textContent = "Setting cover…";
    var res = await fetch(SB_URL + "/rest/v1/galleries?id=eq." + galleryRow.id, {
      method: "PATCH",
      headers: Object.assign({ "Content-Type": "application/json", Prefer: "return=representation" }, authHeaders),
      body: JSON.stringify({ cover_photo_url: url })
    });
    if (res.ok) {
      galleryRow.cover_photo_url = url;
      renderCover();
      renderGrid();
      el("uploadStatus").textContent = "Cover photo updated.";
    } else {
      el("uploadStatus").textContent = "Could not update. Try logging in again.";
    }
  }

  // ---- Dropbox is the real photo storage; Supabase only ever stores the resulting links ----
  var DROPBOX_APP_KEY = "s7zepyr2rekvtbd";

  async function getDropboxAccessToken() {
    var refreshToken = "";
    try {
      refreshToken = localStorage.getItem("kyriake_dropbox_refresh_token") || "";
    } catch (_) {}
    if (!refreshToken) return null;
    var res = await fetch("https://api.dropboxapi.com/oauth2/token", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: new URLSearchParams({ grant_type: "refresh_token", refresh_token: refreshToken, client_id: DROPBOX_APP_KEY }).toString()
    });
    var data = await res.json();
    if (!res.ok || !data.access_token) return null;
    return data.access_token;
  }

  function dropboxGalleryFolder() {
    var firstSeg = (galleryRow.address || "Untitled project").split(",")[0].replace(/[\/\\]+/g, "-");
    return "/Kyriake Media/" + firstSeg + "/04 CLIENT GALLERY";
  }

  function toRawDropboxUrl(sharedUrl) {
    try {
      var u = new URL(sharedUrl);
      u.searchParams.delete("dl");
      u.searchParams.set("raw", "1");
      return u.toString();
    } catch (e) {
      return sharedUrl.split("?")[0] + "?raw=1";
    }
  }

  async function getOrCreateSharedLink(token, path) {
    var createRes = await fetch("https://api.dropboxapi.com/2/sharing/create_shared_link_with_settings", {
      method: "POST",
      headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
      body: JSON.stringify({ path: path })
    });
    var createData = await createRes.json();
    if (createRes.ok && createData.url) return toRawDropboxUrl(createData.url);
    // Link may already exist from a prior upload — look it up instead of failing.
    var listRes = await fetch("https://api.dropboxapi.com/2/sharing/list_shared_links", {
      method: "POST",
      headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
      body: JSON.stringify({ path: path, direct_only: true })
    });
    var listData = await listRes.json();
    if (listRes.ok && listData.links && listData.links[0]) return toRawDropboxUrl(listData.links[0].url);
    throw new Error("Could not get a shareable Dropbox link");
  }

  async function uploadOneToDropbox(token, file) {
    var path = dropboxGalleryFolder() + "/" + Date.now() + "-" + file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
    var buffer = await file.arrayBuffer();
    var upRes = await fetch("https://content.dropboxapi.com/2/files/upload", {
      method: "POST",
      headers: {
        Authorization: "Bearer " + token,
        "Dropbox-API-Arg": JSON.stringify({ path: path, mode: "add", autorename: true, mute: false }),
        "Content-Type": "application/octet-stream"
      },
      body: buffer
    });
    if (!upRes.ok) throw new Error("Dropbox upload failed");
    var meta = await upRes.json();
    return getOrCreateSharedLink(token, meta.path_display || path);
  }

  el("fileInput").addEventListener("change", async function (e) {
    var files = Array.from(e.target.files || []);
    if (!files.length) return;
    el("uploadStatus").textContent = "Connecting to Dropbox…";
    var token = await getDropboxAccessToken();
    if (!token) {
      el("uploadStatus").textContent = "Dropbox isn't connected — connect it from the CRM's Settings first.";
      e.target.value = "";
      return;
    }
    var done = 0;
    for (var i = 0; i < files.length; i++) {
      el("uploadStatus").textContent = "Uploading " + (done + 1) + "/" + files.length + " to Dropbox…";
      try {
        var directUrl = await uploadOneToDropbox(token, files[i]);
        var insRes = await fetch(SB_URL + "/rest/v1/gallery_photos", {
          method: "POST",
          headers: Object.assign({ "Content-Type": "application/json", Prefer: "return=representation" }, authHeaders),
          body: JSON.stringify({ gallery_id: galleryRow.id, url: directUrl, sort_order: photos.length + i })
        });
        if (insRes.ok) {
          var inserted = await insRes.json();
          photos.push(inserted[0]);
          if (!galleryRow.cover_photo_url) {
            galleryRow.cover_photo_url = directUrl;
            await fetch(SB_URL + "/rest/v1/galleries?id=eq." + galleryRow.id, {
              method: "PATCH",
              headers: Object.assign({ "Content-Type": "application/json" }, authHeaders),
              body: JSON.stringify({ cover_photo_url: directUrl })
            });
          }
        }
      } catch (err) {
        el("uploadStatus").textContent = "Some uploads failed: " + (err && err.message ? err.message : "unknown error");
      }
      done++;
    }
    el("uploadStatus").textContent = "Done — uploaded to Dropbox.";
    renderCover();
    renderGrid();
    e.target.value = "";
  });

  // ---- filenames / downloads ----
  function photoBaseName(p, idx) {
    var name = (p.dropbox_path || "").split("/").pop() || "";
    name = name.replace(/\.[a-zA-Z0-9]+$/, "");
    if (!name) name = "photo-" + String(idx + 1).padStart(2, "0");
    return name;
  }

  function triggerBlobDownload(blob, filename) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  }

  async function fetchAsBlob(url) {
    var res = await fetch(url);
    if (!res.ok) throw new Error("Could not fetch the photo");
    return res.blob();
  }

  function blobToImageBitmap(blob) {
    if (window.createImageBitmap) return createImageBitmap(blob);
    return new Promise(function (resolve, reject) {
      var img = new Image();
      var url = URL.createObjectURL(blob);
      img.onload = function () { URL.revokeObjectURL(url); resolve(img); };
      img.onerror = reject;
      img.src = url;
    });
  }

  function canvasToBlob(canvas, quality) {
    return new Promise(function (resolve) { canvas.toBlob(resolve, "image/jpeg", quality); });
  }

  async function build8MbBlob(photoUrl, onProgress) {
    if (onProgress) onProgress("Fetching photo…");
    var srcBlob = await fetchAsBlob(photoUrl);
    var img = await blobToImageBitmap(srcBlob);
    var w = img.width || img.naturalWidth;
    var h = img.height || img.naturalHeight;
    var canvas = document.createElement("canvas");
    canvas.width = w;
    canvas.height = h;
    var ctx = canvas.getContext("2d");
    ctx.drawImage(img, 0, 0, w, h);

    if (galleryRow && galleryRow.logo_url) {
      try {
        if (onProgress) onProgress("Adding logo…");
        var logoBlob = await fetchAsBlob(galleryRow.logo_url);
        var logoImg = await blobToImageBitmap(logoBlob);
        var lw0 = logoImg.width || logoImg.naturalWidth;
        var lh0 = logoImg.height || logoImg.naturalHeight;
        var maxW = w * 0.18;
        var scale = Math.min(1, maxW / lw0);
        var lw = lw0 * scale, lh = lh0 * scale;
        var pad = w * 0.02;
        ctx.drawImage(logoImg, w - lw - pad, h - lh - pad, lw, lh);
      } catch (e) { /* logo optional — skip silently if it can't be fetched */ }
    }

    var target = 8 * 1024 * 1024;
    var quality = 0.92;
    if (onProgress) onProgress("Compressing…");
    var blob = await canvasToBlob(canvas, quality);
    while (blob.size > target && quality > 0.3) {
      quality -= 0.08;
      blob = await canvasToBlob(canvas, quality);
    }
    return blob;
  }

  el("downloadAllBtn").onclick = async function () {
    if (!photos.length) return;
    var btn = el("downloadAllBtn");
    var original = btn.textContent;
    try {
      if (typeof JSZip === "undefined") throw new Error("Zip library did not load");
      var zip = new JSZip();
      for (var i = 0; i < photos.length; i++) {
        btn.textContent = "ZIPPING " + (i + 1) + "/" + photos.length + "…";
        var blob = await fetchAsBlob(photos[i].url);
        zip.file(photoBaseName(photos[i], i) + ".jpg", blob);
      }
      btn.textContent = "PREPARING ZIP…";
      var zipBlob = await zip.generateAsync({ type: "blob" });
      var addr = (galleryRow.address || "gallery").split(",")[0].replace(/[^a-zA-Z0-9-_ ]/g, "").trim() || "gallery";
      triggerBlobDownload(zipBlob, addr + ".zip");
    } catch (err) {
      alert("Could not build the download — " + (err && err.message ? err.message : "unknown error"));
    } finally {
      btn.textContent = original;
    }
  };

  // ---- lightbox ----
  function openLightbox(idx) {
    lbIndex = idx;
    renderLightbox();
    el("lightbox").classList.add("open");
  }
  function closeLightbox() {
    el("lightbox").classList.remove("open");
  }
  function renderLightbox() {
    if (lbIndex < 0 || !photos[lbIndex]) return;
    el("lbImg").src = photos[lbIndex].url;
    el("lbStatus").textContent = "";
  }
  el("lbClose").onclick = closeLightbox;
  el("lbPrev").onclick = function () {
    if (!photos.length) return;
    lbIndex = (lbIndex - 1 + photos.length) % photos.length;
    renderLightbox();
  };
  el("lbNext").onclick = function () {
    if (!photos.length) return;
    lbIndex = (lbIndex + 1) % photos.length;
    renderLightbox();
  };
  el("lightbox").addEventListener("click", function (e) {
    if (e.target.id === "lightbox") closeLightbox();
  });
  document.addEventListener("keydown", function (e) {
    if (!el("lightbox").classList.contains("open")) return;
    if (e.key === "Escape") closeLightbox();
    if (e.key === "ArrowLeft") el("lbPrev").click();
    if (e.key === "ArrowRight") el("lbNext").click();
  });

  el("lbDownloadFull").onclick = async function () {
    if (lbIndex < 0 || !photos[lbIndex]) return;
    el("lbStatus").textContent = "Downloading full size…";
    try {
      var blob = await fetchAsBlob(photos[lbIndex].url);
      triggerBlobDownload(blob, photoBaseName(photos[lbIndex], lbIndex) + ".jpg");
      el("lbStatus").textContent = "Downloaded.";
    } catch (err) {
      el("lbStatus").textContent = "Could not download — " + (err && err.message ? err.message : "unknown error");
    }
  };

  el("lbDownload8").onclick = async function () {
    if (lbIndex < 0 || !photos[lbIndex]) return;
    try {
      var blob = await build8MbBlob(photos[lbIndex].url, function (msg) { el("lbStatus").textContent = msg; });
      triggerBlobDownload(blob, photoBaseName(photos[lbIndex], lbIndex) + "-8mb.jpg");
      el("lbStatus").textContent = "Downloaded.";
    } catch (err) {
      el("lbStatus").textContent = "Could not download — " + (err && err.message ? err.message : "unknown error");
    }
  };

  // ---- messages (backed by Supabase, tied to this gallery) ----
  function messagesSenderName() {
    var stored = "";
    try { stored = localStorage.getItem("kyriake_gallery_msg_name") || ""; } catch (_) {}
    return isStaff ? (staffEmail || "Kyriake Media") : stored;
  }

  function renderMessages() {
    var log = el("messagesLog");
    var emptyEl = el("messagesEmpty");
    var nameRow = el("messagesNameRow");
    nameRow.classList.toggle("hidden", isStaff);
    if (!isStaff) {
      var stored = "";
      try { stored = localStorage.getItem("kyriake_gallery_msg_name") || ""; } catch (_) {}
      el("messagesName").value = stored;
    }
    log.innerHTML = "";
    emptyEl.classList.toggle("hidden", messages.length > 0);
    messages.forEach(function (m) {
      var row = document.createElement("div");
      row.className = "msgRow" + (m.sender_role === "staff" ? " staff" : "");
      var who = document.createElement("div");
      who.className = "who";
      who.textContent = (m.sender_name || (m.sender_role === "staff" ? "Kyriake Media" : "Client")) + (m.created_at ? " · " + new Date(m.created_at).toLocaleString() : "");
      var txt = document.createElement("div");
      txt.className = "txt";
      txt.textContent = m.text || "";
      row.appendChild(who);
      row.appendChild(txt);
      log.appendChild(row);
    });
    log.scrollTop = log.scrollHeight;
  }

  async function loadMessages() {
    if (!galleryRow) return;
    try {
      var res = await fetch(SB_URL + "/rest/v1/gallery_messages?gallery_id=eq." + galleryRow.id + "&select=*&order=created_at.asc", {
        headers: authHeaders
      });
      messages = res.ok ? await res.json() : [];
    } catch (e) {
      messages = [];
    }
    renderMessages();
  }

  var messagesForm = el("messagesForm");
  if (messagesForm) messagesForm.addEventListener("submit", async function (e) {
    e.preventDefault();
    var input = el("messagesInput");
    var text = (input.value || "").trim();
    if (!text || !galleryRow) return;
    var name = messagesSenderName();
    if (!isStaff) {
      name = (el("messagesName").value || "").trim();
      if (!name) { el("messagesName").focus(); return; }
      try { localStorage.setItem("kyriake_gallery_msg_name", name); } catch (_) {}
    }
    input.disabled = true;
    try {
      var res = await fetch(SB_URL + "/rest/v1/gallery_messages", {
        method: "POST",
        headers: Object.assign({ "Content-Type": "application/json", Prefer: "return=representation" }, authHeaders),
        body: JSON.stringify({
          gallery_id: galleryRow.id,
          sender_role: isStaff ? "staff" : "client",
          sender_name: name,
          text: text
        })
      });
      if (res.ok) {
        var inserted = await res.json();
        messages.push(inserted[0]);
        renderMessages();
        input.value = "";
      }
    } catch (err) { /* leave the draft in place so the user can retry */ }
    input.disabled = false;
  });

  if (!slug) { showState("notfound"); }
  else { fetchGallery(); }
})();
</script>
