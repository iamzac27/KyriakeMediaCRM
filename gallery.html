<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; background: #fff; color: #111; }
  .hidden { display: none !important; }

  #topbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 22px; border-bottom: 1px solid rgba(17,17,17,.11); }
  #topbar a { text-decoration: none; color: #111; font-size: 12.5px; font-weight: 600; letter-spacing: .1em; }
  #staffBar { display: none; align-items: center; gap: 14px; font-size: 12px; color: #6f6c66; }
  #staffBar button { border: 1px solid rgba(17,17,17,.3); background: #fff; cursor: pointer; font: inherit; font-size: 11px; font-weight: 600; letter-spacing: .08em; padding: 8px 12px; }
  #staffBar button:hover { background: #111; color: #fff; }

  #state-loading, #state-notfound { display: flex; align-items: center; justify-content: center; min-height: 70vh; font-size: 14px; color: #6f6c66; text-align: center; padding: 20px; }

  /* cover landing */
  #cover { position: relative; height: 88vh; min-height: 480px; overflow: hidden; background: #111; }
  #cover img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: .92; }
  #cover .scrim { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,.15), rgba(0,0,0,.1) 40%, rgba(0,0,0,.65)); }
  #cover .content { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: #fff; padding: 24px; gap: 26px; }
  #cover .address { font-family: 'Playfair Display', Georgia, serif; font-size: clamp(26px, 5vw, 52px); letter-spacing: .04em; font-weight: 500; text-transform: uppercase; text-shadow: 0 2px 18px rgba(0,0,0,.35); max-width: 900px; }
  #cover .meta { font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: rgba(255,255,255,.85); }
  #cover .viewBtn { border: 1.5px solid #fff; background: rgba(255,255,255,.06); color: #fff; cursor: pointer; font: inherit; font-size: 12.5px; font-weight: 600; letter-spacing: .2em; padding: 15px 40px; backdrop-filter: blur(2px); }
  #cover .viewBtn:hover { background: #fff; color: #111; }
  #cover .wordmark { position: absolute; left: 0; right: 0; bottom: 28px; text-align: center; font-size: 11px; letter-spacing: .32em; color: rgba(255,255,255,.92); font-weight: 500; }
  #cover .unpub { position: absolute; top: 16px; left: 16px; background: #b3452f; color: #fff; font-size: 11px; font-weight: 600; letter-spacing: .08em; padding: 6px 12px; }

  /* full gallery */
  #full { display: none; }
  #full .headerRow { padding: 26px 22px 10px; text-align: center; }
  #full .headerRow .addr { font-family: 'Playfair Display', Georgia, serif; font-size: 24px; font-weight: 500; }
  #full .headerRow .sub { font-size: 12px; color: #6f6c66; margin-top: 4px; }
  #full .backBtn { display: block; margin: 0 auto 18px; border: 0; background: none; cursor: pointer; font: inherit; font-size: 11.5px; letter-spacing: .1em; color: #6f6c66; }
  #full .backBtn:hover { color: #111; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 4px; padding: 0 4px 60px; }
  #grid .cell { position: relative; aspect-ratio: 4/3; overflow: hidden; background: #f1efe9; }
  #grid .cell img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #grid .cell .coverTag { position: absolute; top: 8px; left: 8px; background: rgba(17,17,17,.75); color: #fff; font-size: 9.5px; letter-spacing: .1em; padding: 4px 8px; }
  #grid .cell .setCoverBtn { position: absolute; bottom: 8px; right: 8px; border: 0; background: rgba(255,255,255,.92); cursor: pointer; font: inherit; font-size: 10px; font-weight: 600; letter-spacing: .06em; padding: 6px 9px; display: none; }
  #grid .cell:hover .setCoverBtn { display: block; }
  #empty { text-align: center; color: #6f6c66; font-size: 13px; padding: 40px 20px 70px; }

  #uploadBar { display: none; align-items: center; justify-content: center; gap: 14px; padding: 14px 22px; border-top: 1px solid rgba(17,17,17,.11); background: #faf9f5; position: sticky; bottom: 0; }
  #uploadBar label { border: 1px solid rgba(17,17,17,.3); background: #2f5f47; color: #fff; cursor: pointer; font-size: 11.5px; font-weight: 600; letter-spacing: .1em; padding: 12px 20px; }
  #uploadBar label:hover { background: #25503b; }
  #uploadBar input[type=file] { display: none; }
  #uploadStatus { font-size: 12px; color: #6f6c66; }
  #publishToggle { border: 1px solid rgba(17,17,17,.3); background: #fff; cursor: pointer; font: inherit; font-size: 11.5px; font-weight: 600; letter-spacing: .08em; padding: 12px 18px; }
</style>
</head>
<body>

<div id="topbar">
  <a href="./index.html">KYRIAKE MEDIA</a>
  <div id="staffBar">
    <span id="staffEmail"></span>
    <button id="logoutBtn">Log out</button>
  </div>
</div>

<div id="state-loading">Loading gallery…</div>

<div id="state-notfound" class="hidden">
  This gallery link isn't valid, or the gallery hasn't been published yet.<br>
  Ask your photographer for the correct link.
</div>

<div id="page" class="hidden">
  <div id="cover">
    <div id="unpubBadge" class="unpub hidden">UNPUBLISHED — only visible to staff</div>
    <img id="coverImg" src="" alt="">
    <div class="scrim"></div>
    <div class="content">
      <div class="address" id="addressText"></div>
      <div class="meta" id="metaText"></div>
      <button class="viewBtn" id="viewGalleryBtn">VIEW GALLERY</button>
    </div>
    <div class="wordmark">KYRIAKE MEDIA</div>
  </div>

  <div id="full">
    <div class="headerRow">
      <div class="addr" id="fullAddress"></div>
      <div class="sub" id="fullMeta"></div>
    </div>
    <button class="backBtn" id="backBtn">← BACK TO COVER</button>
    <div id="grid"></div>
    <div id="empty" class="hidden">No photos uploaded yet.</div>
  </div>

  <div id="uploadBar">
    <label>UPLOAD PHOTOS<input type="file" id="fileInput" accept="image/*" multiple></label>
    <button id="publishToggle"></button>
    <span id="uploadStatus"></span>
  </div>
</div>

<script>
(function () {
  var SB_URL = "https://igihkpzxcxcjdjnghvdk.supabase.co";
  var SB_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlnaWhrcHp4Y3hjamRqbmdodmRrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4NTY2NzQsImV4cCI6MjEwNDQzMjY3NH0.wKekwGnt7VzvEUuuWV2WWd-nRxHm50wHHcRrzZccWfE";

  var params = new URLSearchParams(location.search);
  var slug = (params.get("slug") || "").trim();

  var accessToken = null, isStaff = false, staffEmail = null;
  try {
    accessToken = localStorage.getItem("kyriake_sb_access_token");
    isStaff = localStorage.getItem("kyriake_sb_is_staff") === "true";
    staffEmail = localStorage.getItem("kyriake_sb_user_email");
  } catch (_) {}

  var authHeaders = {
    apikey: SB_ANON_KEY,
    Authorization: "Bearer " + (isStaff && accessToken ? accessToken : SB_ANON_KEY)
  };

  var galleryRow = null;
  var photos = [];

  function el(id) { return document.getElementById(id); }

  function showState(name) {
    el("state-loading").classList.toggle("hidden", name !== "loading");
    el("state-notfound").classList.toggle("hidden", name !== "notfound");
    el("page").classList.toggle("hidden", name !== "page");
  }

  function renderStaffBar() {
    if (isStaff && staffEmail) {
      el("staffBar").style.display = "flex";
      el("staffEmail").textContent = staffEmail;
    }
  }

  function renderCover() {
    el("addressText").textContent = galleryRow.address || "";
    var metaParts = [];
    if (galleryRow.agent_name) metaParts.push(galleryRow.agent_name);
    if (galleryRow.agency) metaParts.push(galleryRow.agency);
    el("metaText").textContent = metaParts.join(" · ");
    el("coverImg").src = galleryRow.cover_photo_url || (photos[0] ? photos[0].url : "");
    el("unpubBadge").classList.toggle("hidden", !!galleryRow.published);
    el("fullAddress").textContent = galleryRow.address || "";
    el("fullMeta").textContent = metaParts.join(" · ");
  }

  function renderGrid() {
    var grid = el("grid");
    grid.innerHTML = "";
    el("empty").classList.toggle("hidden", photos.length > 0);
    photos.forEach(function (p) {
      var cell = document.createElement("div");
      cell.className = "cell";
      var img = document.createElement("img");
      img.src = p.url;
      cell.appendChild(img);
      if (galleryRow.cover_photo_url === p.url) {
        var tag = document.createElement("div");
        tag.className = "coverTag";
        tag.textContent = "COVER";
        cell.appendChild(tag);
      }
      if (isStaff) {
        var btn = document.createElement("button");
        btn.className = "setCoverBtn";
        btn.textContent = "SET AS COVER";
        btn.onclick = function () { setCoverPhoto(p.url); };
        cell.appendChild(btn);
      }
      grid.appendChild(cell);
    });
  }

  function renderStaffControls() {
    if (!isStaff) return;
    el("uploadBar").style.display = "flex";
    var pub = el("publishToggle");
    pub.textContent = galleryRow.published ? "UNPUBLISH" : "PUBLISH";
    pub.onclick = togglePublish;
  }

  async function fetchGallery() {
    var res = await fetch(SB_URL + "/rest/v1/galleries?slug=eq." + encodeURIComponent(slug) + "&select=*", {
      headers: authHeaders
    });
    var rows = await res.json();
    if (!res.ok || !rows || !rows.length) { showState("notfound"); return; }
    galleryRow = rows[0];
    var pres = await fetch(SB_URL + "/rest/v1/gallery_photos?gallery_id=eq." + galleryRow.id + "&select=*&order=sort_order.asc", {
      headers: authHeaders
    });
    photos = pres.ok ? await pres.json() : [];
    renderCover();
    renderGrid();
    renderStaffControls();
    renderStaffBar();
    showState("page");
  }

  el("viewGalleryBtn").onclick = function () {
    el("cover").style.display = "none";
    el("full").style.display = "block";
  };
  el("backBtn").onclick = function () {
    el("full").style.display = "none";
    el("cover").style.display = "block";
  };

  var logoutBtn = el("logoutBtn");
  if (logoutBtn) logoutBtn.onclick = function () {
    try {
      localStorage.removeItem("kyriake_sb_access_token");
      localStorage.removeItem("kyriake_sb_refresh_token");
      localStorage.removeItem("kyriake_sb_user_email");
      localStorage.removeItem("kyriake_sb_is_staff");
    } catch (_) {}
    location.reload();
  };

  async function togglePublish() {
    var next = !galleryRow.published;
    el("uploadStatus").textContent = "Saving…";
    var res = await fetch(SB_URL + "/rest/v1/galleries?id=eq." + galleryRow.id, {
      method: "PATCH",
      headers: Object.assign({ "Content-Type": "application/json", Prefer: "return=representation" }, authHeaders),
      body: JSON.stringify({ published: next })
    });
    if (res.ok) {
      galleryRow.published = next;
      renderCover();
      renderStaffControls();
      el("uploadStatus").textContent = "Saved.";
    } else {
      el("uploadStatus").textContent = "Could not update. Try logging in again.";
    }
  }

  async function setCoverPhoto(url) {
    el("uploadStatus").textContent = "Setting cover…";
    var res = await fetch(SB_URL + "/rest/v1/galleries?id=eq." + galleryRow.id, {
      method: "PATCH",
      headers: Object.assign({ "Content-Type": "application/json", Prefer: "return=representation" }, authHeaders),
      body: JSON.stringify({ cover_photo_url: url })
    });
    if (res.ok) {
      galleryRow.cover_photo_url = url;
      renderCover();
      renderGrid();
      el("uploadStatus").textContent = "Cover photo updated.";
    } else {
      el("uploadStatus").textContent = "Could not update. Try logging in again.";
    }
  }

  // ---- Dropbox is the real photo storage; Supabase only ever stores the resulting links ----
  var DROPBOX_APP_KEY = "s7zepyr2rekvtbd";

  async function getDropboxAccessToken() {
    var refreshToken = "";
    try {
      refreshToken = localStorage.getItem("kyriake_dropbox_refresh_token") || "";
    } catch (_) {}
    if (!refreshToken) return null;
    var res = await fetch("https://api.dropboxapi.com/oauth2/token", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: new URLSearchParams({ grant_type: "refresh_token", refresh_token: refreshToken, client_id: DROPBOX_APP_KEY }).toString()
    });
    var data = await res.json();
    if (!res.ok || !data.access_token) return null;
    return data.access_token;
  }

  function dropboxGalleryFolder() {
    var firstSeg = (galleryRow.address || "Untitled project").split(",")[0].replace(/[\/\\]+/g, "-");
    return "/Kyriake Media/" + firstSeg + "/04 CLIENT GALLERY";
  }

  function toRawDropboxUrl(sharedUrl) {
    return sharedUrl.split("?")[0] + "?raw=1";
  }

  async function getOrCreateSharedLink(token, path) {
    var createRes = await fetch("https://api.dropboxapi.com/2/sharing/create_shared_link_with_settings", {
      method: "POST",
      headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
      body: JSON.stringify({ path: path })
    });
    var createData = await createRes.json();
    if (createRes.ok && createData.url) return toRawDropboxUrl(createData.url);
    // Link may already exist from a prior upload — look it up instead of failing.
    var listRes = await fetch("https://api.dropboxapi.com/2/sharing/list_shared_links", {
      method: "POST",
      headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
      body: JSON.stringify({ path: path, direct_only: true })
    });
    var listData = await listRes.json();
    if (listRes.ok && listData.links && listData.links[0]) return toRawDropboxUrl(listData.links[0].url);
    throw new Error("Could not get a shareable Dropbox link");
  }

  async function uploadOneToDropbox(token, file) {
    var path = dropboxGalleryFolder() + "/" + Date.now() + "-" + file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
    var buffer = await file.arrayBuffer();
    var upRes = await fetch("https://content.dropboxapi.com/2/files/upload", {
      method: "POST",
      headers: {
        Authorization: "Bearer " + token,
        "Dropbox-API-Arg": JSON.stringify({ path: path, mode: "add", autorename: true, mute: false }),
        "Content-Type": "application/octet-stream"
      },
      body: buffer
    });
    if (!upRes.ok) throw new Error("Dropbox upload failed");
    var meta = await upRes.json();
    return getOrCreateSharedLink(token, meta.path_display || path);
  }

  el("fileInput").addEventListener("change", async function (e) {
    var files = Array.from(e.target.files || []);
    if (!files.length) return;
    el("uploadStatus").textContent = "Connecting to Dropbox…";
    var token = await getDropboxAccessToken();
    if (!token) {
      el("uploadStatus").textContent = "Dropbox isn't connected — connect it from the CRM's Settings first.";
      e.target.value = "";
      return;
    }
    var done = 0;
    for (var i = 0; i < files.length; i++) {
      el("uploadStatus").textContent = "Uploading " + (done + 1) + "/" + files.length + " to Dropbox…";
      try {
        var directUrl = await uploadOneToDropbox(token, files[i]);
        var insRes = await fetch(SB_URL + "/rest/v1/gallery_photos", {
          method: "POST",
          headers: Object.assign({ "Content-Type": "application/json", Prefer: "return=representation" }, authHeaders),
          body: JSON.stringify({ gallery_id: galleryRow.id, url: directUrl, sort_order: photos.length + i })
        });
        if (insRes.ok) {
          var inserted = await insRes.json();
          photos.push(inserted[0]);
          if (!galleryRow.cover_photo_url) {
            galleryRow.cover_photo_url = directUrl;
            await fetch(SB_URL + "/rest/v1/galleries?id=eq." + galleryRow.id, {
              method: "PATCH",
              headers: Object.assign({ "Content-Type": "application/json" }, authHeaders),
              body: JSON.stringify({ cover_photo_url: directUrl })
            });
          }
        }
      } catch (err) {
        el("uploadStatus").textContent = "Some uploads failed: " + (err && err.message ? err.message : "unknown error");
      }
      done++;
    }
    el("uploadStatus").textContent = "Done — uploaded to Dropbox.";
    renderCover();
    renderGrid();
    e.target.value = "";
  });

  if (!slug) { showState("notfound"); }
  else { fetchGallery(); }
})();
</script>

</body>
</html>
