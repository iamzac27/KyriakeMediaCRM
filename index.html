<head>
  <meta charset="utf-8">
  <title>Bundled Page</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #fff; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }
    #__bundler_placeholder { color: #999; font-size: 14px; }
  </style>
  <noscript>
    <style>#__bundler_loading { display: none; }</style>
    <div style="position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">
      This page requires JavaScript to display.
    </div>
  </noscript>
</head>
<body>
  <div id="__bundler_thumbnail"></div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

fg }}\">{{ t.label }}<\/button>\n          <\/sc-for>\n        <\/div>\n\n        <div style=\"display:flex;flex-direction:column;gap:11px;margin-top:18px\">\n          <label style=\"display:flex;flex-direction:column;gap:6px\">\n            <span style=\"font-size:9.5px;letter-spacing:.15em;color:#6f6c66;font-weight:500\">EMAIL<\/span>\n            <input value=\"{{ email }}\" sc-camel-on-change=\"{{ onEmail }}\" placeholder=\"you@studio.com\" style=\"border:1px solid rgba(17,17,17,.18);outline:none;font-family:inherit;font-size:13.5px;padding:11px 12px;color:#111;background:#fbfaf8\">\n          <\/label>\n          <label style=\"display:flex;flex-direction:column;gap:6px\">\n            <span style=\"font-size:9.5px;letter-spacing:.15em;color:#6f6c66;font-weight:500\">{{ passLabel }}<\/span>\n            <input type=\"password\" value=\"{{ pass }}\" sc-camel-on-change=\"{{ onPass }}\" placeholder=\"\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022\" style=\"border:1px solid rgba(17,17,17,.18);outline:none;font-family:inherit;font-size:13.5px;padding:11px 12px;color:#111;background:#fbfaf8\">\n          <\/label>\n        <\/div>\n\n        <sc-if value=\"{{ authErrorOpen }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font-size:12px;color:#b3452f;margin-top:14px;line-height:1.5\">{{ authError }}<\/div>\n        <\/sc-if>\n\n        <button sc-camel-on-click=\"{{ authSubmit }}\" style=\"display:block;width:100%;text-align:center;margin-top:20px;border:0;cursor:pointer;font-family:inherit;background:#2f5f47;color:#fff;font-size:11.5px;font-weight:600;letter-spacing:.13em;padding:14px 20px\" style-hover=\"background:#25503b;color:#fff\">{{ authCta }}<\/button>\n\n        <div style=\"font-size:11.5px;color:#7d867f;margin-top:14px;line-height:1.55;text-align:center\">{{ authFoot }}<\/div>\n      <\/div>\n    <\/div>\n  <\/sc-if>\n\n  <sc-if value=\"{{ noticeOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;inset:0;z-index:60;background:rgba(17,19,17,.42);display:flex;align-items:center;justify-content:center;padding:24px\">\n      <div style=\"width:100%;max-width:392px;background:#fff;border:1px solid rgba(17,17,17,.12);padding:30px\">\n        <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:16px\">\n          <div style=\"font-family:'Playfair Display',Georgia,serif;font-size:23px;font-weight:500;letter-spacing:-.01em\">{{ noticeTitle }}<\/div>\n          <button sc-camel-on-click=\"{{ closeNotice }}\" style=\"flex:none;border:0;background:none;cursor:pointer;font-family:inherit;font-size:20px;line-height:1;color:#8d8a83;padding:2px 4px\" style-hover=\"color:#111\">\u00d7<\/button>\n        <\/div>\n        <div style=\"font-size:13.5px;color:#4c534d;margin-top:12px;line-height:1.6\">{{ noticeBody }}<\/div>\n\n        <sc-if value=\"{{ noticeIsGallery }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:11px;margin-top:16px\">\n            <label style=\"display:flex;flex-direction:column;gap:6px\">\n              <span style=\"font-size:9.5px;letter-spacing:.15em;color:#6f6c66;font-weight:500\">GALLERY LINK OR CODE<\/span>\n              <input value=\"{{ gallerySlug }}\" sc-camel-on-change=\"{{ onGallerySlug }}\" placeholder=\"e.g. 15-bruce-avenue\" style=\"border:1px solid rgba(17,17,17,.18);outline:none;font-family:inherit;font-size:13.5px;padding:11px 12px;color:#111;background:#fbfaf8\">\n            <\/label>\n            <sc-if value=\"{{ galleryErrorOpen }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font-size:12px;color:#b3452f\">{{ galleryError }}<\/div>\n            <\/sc-if>\n            <button sc-camel-on-click=\"{{ submitGalleryLookup }}\" style=\"width:100%;border:0;cursor:pointer;font-family:inherit;background:#2f5f47;color:#fff;font-size:11.5px;font-weight:600;letter-spacing:.13em;padding:14px 20px\" style-hover=\"background:#25503b;color:#fff\">{{ galleryButtonLabel }}<\/button>\n          <\/div>\n        <\/sc-if>\n\n        <sc-if value=\"{{ noticeIsInquiry }}\" hint-placeholder-val=\"{{ false }}\">\n          <sc-if value=\"{{ inquirySent }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-size:13.5px;color:#2f5f47;margin-top:14px;line-height:1.6\">Thanks \u2014 your inquiry is in. We'll reply within a few hours.<\/div>\n          <\/sc-if>\n          <sc-if value=\"{{ inquiryFormOpen }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"display:flex;flex-direction:column;gap:11px;margin-top:16px\">\n              <label style=\"display:flex;flex-direction:column;gap:6px\">\n                <span style=\"font-size:9.5px;letter-spacing:.15em;color:#6f6c66;font-weight:500\">NAME<\/span>\n                <input value=\"{{ iName }}\" sc-camel-on-change=\"{{ onIName }}\" placeholder=\"Your name\" style=\"border:1px solid rgba(17,17,17,.18);outline:none;font-family:inherit;font-size:13.5px;padding:11px 12px;color:#111;background:#fbfaf8\">\n              <\/label>\n              <label style=\"display:flex;flex-direction:column;gap:6px\">\n                <span style=\"font-size:9.5px;letter-spacing:.15em;color:#6f6c66;font-weight:500\">EMAIL<\/span>\n                <input value=\"{{ iEmail }}\" sc-camel-on-change=\"{{ onIEmail }}\" placeholder=\"you@agency.com\" style=\"border:1px solid rgba(17,17,17,.18);outline:none;font-family:inherit;font-size:13.5px;padding:11px 12px;color:#111;background:#fbfaf8\">\n              <\/label>\n              <label style=\"display:flex;flex-direction:column;gap:6px\">\n                <span style=\"font-size:9.5px;letter-spacing:.15em;color:#6f6c66;font-weight:500\">PHONE<\/span>\n                <input value=\"{{ iPhone }}\" sc-camel-on-change=\"{{ onIPhone }}\" placeholder=\"Optional\" style=\"border:1px solid rgba(17,17,17,.18);outline:none;font-family:inherit;font-size:13.5px;padding:11px 12px;color:#111;background:#fbfaf8\">\n              <\/label>\n              <label style=\"display:flex;flex-direction:column;gap:6px\">\n                <span style=\"font-size:9.5px;letter-spacing:.15em;color:#6f6c66;font-weight:500\">LISTING ADDRESS<\/span>\n                <input value=\"{{ iAddress }}\" sc-camel-on-change=\"{{ onIAddress }}\" placeholder=\"Street, suburb\" style=\"border:1px solid rgba(17,17,17,.18);outline:none;font-family:inherit;font-size:13.5px;padding:11px 12px;color:#111;background:#fbfaf8\">\n              <\/label>\n              <label style=\"display:flex;flex-direction:column;gap:6px\">\n                <span style=\"font-size:9.5px;letter-spacing:.15em;color:#6f6c66;font-weight:500\">WHAT DO YOU NEED?<\/span>\n                <input value=\"{{ iService }}\" sc-camel-on-change=\"{{ onIService }}\" placeholder=\"Photo, video, drone, 3D tour\" style=\"border:1px solid rgba(17,17,17,.18);outline:none;font-family:inherit;font-size:13.5px;padding:11px 12px;color:#111;background:#fbfaf8\">\n              <\/label>\n              <label style=\"display:flex;flex-direction:column;gap:6px\">\n                <span style=\"font-size:9.5px;letter-spacing:.15em;color:#6f6c66;font-weight:500\">MESSAGE<\/span>\n                <input value=\"{{ iMessage }}\" sc-camel-on-change=\"{{ onIMessage }}\" placeholder=\"Listing date, timing, anything else\" style=\"border:1px solid rgba(17,17,17,.18);outline:none;font-family:inherit;font-size:13.5px;padding:11px 12px;color:#111;background:#fbfaf8\">\n              <\/label>\n              <sc-if value=\"{{ inquiryErrorOpen }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"font-size:12px;color:#b3452f\">{{ inquiryError }}<\/div>\n              <\/sc-if>\n              <button sc-camel-on-click=\"{{ submitInquiry }}\" style=\"width:100%;border:0;cursor:pointer;font-family:inherit;background:#2f5f47;color:#fff;font-size:11.5px;font-weight:600;letter-spacing:.13em;padding:14px 20px\" style-hover=\"background:#25503b;color:#fff\">{{ inquiryButtonLabel }}<\/button>\n            <\/div>\n          <\/sc-if>\n        <\/sc-if>\n\n        <button sc-camel-on-click=\"{{ closeNotice }}\" style=\"width:100%;margin-top:22px;border:1px solid rgba(17,17,17,.35);background:transparent;cursor:pointer;font-family:inherit;font-size:11px;font-weight:600;letter-spacing:.14em;padding:13px 20px;color:#111\" style-hover=\"background:#111;color:#fff\">CLOSE<\/button>\n      <\/div>\n    <\/div>\n  <\/sc-if>\n\n<\/div>\n\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{}\">\nconst SB_URL = \"https://igihkpzxcxcjdjnghvdk.supabase.co\";\nconst SB_ANON_KEY = \"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlnaWhrcHp4Y3hjamRqbmdodmRrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4NTY2NzQsImV4cCI6MjEwNDQzMjY3NH0.wKekwGnt7VzvEUuuWV2WWd-nRxHm50wHHcRrzZccWfE\";\n\nclass Component extends DCLogic {\n  state = {\n    authOpen: false, mode: \"login\", email: \"\", pass: \"\", notice: null,\n    authBusy: false, authError: null,\n    gallerySlug: \"\", galleryBusy: false, galleryError: null,\n    iName: \"\", iEmail: \"\", iPhone: \"\", iAddress: \"\", iService: \"\", iMessage: \"\",\n    inquiryBusy: false, inquiryError: null, inquirySent: false,\n    sessionEmail: null, sessionIsStaff: false\n  };\n\n  componentDidMount() {\n    let email = null, isStaff = false;\n    try {\n      email = localStorage.getItem(\"kyriake_sb_user_email\");\n      isStaff = localStorage.getItem(\"kyriake_sb_is_staff\") === \"true\";\n    } catch (_) {}\n    if (email) this.setState({ sessionEmail: email, sessionIsStaff: isStaff });\n  }\n\n  authSubmit = async () => {\n    const s = this.state;\n    if (!s.email || !s.pass) { this.setState({ authError: \"Enter your email and password.\" }); return; }\n    this.setState({ authBusy: true, authError: null });\n    try {\n      if (s.mode === \"login\") {\n        const res = await fetch(SB_URL + \"/auth/v1/token?grant_type=password\", {\n          method: \"POST\",\n          headers: { \"Content-Type\": \"application/json\", apikey: SB_ANON_KEY },\n          body: JSON.stringify({ email: s.email, password: s.pass })\n        });\n        const data = await res.json();\n        if (!res.ok) throw new Error(data.error_description || data.msg || \"Login failed. Check your email and password.\");\n        await this.afterAuth(data.access_token, data.refresh_token, s.email);\n      } else {\n        const res = await fetch(SB_URL + \"/auth/v1/signup\", {\n          method: \"POST\",\n          headers: { \"Content-Type\": \"application/json\", apikey: SB_ANON_KEY },\n          body: JSON.stringify({ email: s.email, password: s.pass })\n        });\n        const data = await res.json();\n        if (!res.ok) throw new Error(data.error_description || data.msg || \"Could not create account.\");\n        if (data.access_token) {\n          await this.afterAuth(data.access_token, data.refresh_token, s.email);\n        } else {\n          this.setState({ authBusy: false, authError: null, mode: \"login\", pass: \"\" });\n          window.alert(\"Account created. Check your email to confirm it, then log in.\");\n        }\n      }\n    } catch (err) {\n      this.setState({ authBusy: false, authError: (err && err.message) || \"Something went wrong.\" });\n    }\n  };\n\n  afterAuth = async (accessToken, refreshToken, email) => {\n    let isStaff = false;\n    try {\n      const userRes = await fetch(SB_URL + \"/auth/v1/user\", {\n        headers: { apikey: SB_ANON_KEY, Authorization: \"Bearer \" + accessToken }\n      });\n      const user = await userRes.json();\n      const profRes = await fetch(SB_URL + \"/rest/v1/profiles?id=eq.\" + user.id + \"&select=is_staff\", {\n        headers: { apikey: SB_ANON_KEY, Authorization: \"Bearer \" + accessToken }\n      });\n      const rows = await profRes.json();\n      isStaff = !!(rows && rows[0] && rows[0].is_staff);\n      try {\n        localStorage.setItem(\"kyriake_sb_access_token\", accessToken);\n        localStorage.setItem(\"kyriake_sb_refresh_token\", refreshToken || \"\");\n        localStorage.setItem(\"kyriake_sb_user_email\", user.email || email || \"\");\n        localStorage.setItem(\"kyriake_sb_is_staff\", isStaff ? \"true\" : \"false\");\n      } catch (_) {}\n    } catch (_) {}\n    this.setState({\n      authBusy: false, authOpen: false, pass: \"\",\n      sessionEmail: email || null, sessionIsStaff: isStaff\n    }, () => {\n      if (isStaff) window.location.href = \"./crm.html\";\n    });\n  };\n\n  logout = () => {\n    try {\n      localStorage.removeItem(\"kyriake_sb_access_token\");\n      localStorage.removeItem(\"kyriake_sb_refresh_token\");\n      localStorage.removeItem(\"kyriake_sb_user_email\");\n      localStorage.removeItem(\"kyriake_sb_is_staff\");\n    } catch (_) {}\n    this.setState({ sessionEmail: null, sessionIsStaff: false });\n  };\n\n  onGallerySlug = e => this.setState({ gallerySlug: e.target.value, galleryError: null });\n\n  submitGalleryLookup = async () => {\n    const slug = (this.state.gallerySlug || \"\").trim().toLowerCase().replace(/\\s+/g, \"-\");\n    if (!slug) { this.setState({ galleryError: \"Enter the gallery link or code.\" }); return; }\n    this.setState({ galleryBusy: true, galleryError: null });\n    try {\n      const res = await fetch(SB_URL + \"/rest/v1/galleries?slug=eq.\" + encodeURIComponent(slug) + \"&select=slug\", {\n        headers: { apikey: SB_ANON_KEY, Authorization: \"Bearer \" + SB_ANON_KEY }\n      });\n      if (!res.ok) throw new Error(\"Something went wrong. Try again.\");\n      const rows = await res.json();\n      if (!rows || !rows.length) {\n        this.setState({ galleryBusy: false, galleryError: \"We couldn't find a gallery with that link. Double-check with your photographer.\" });\n        return;\n      }\n      window.location.href = \"./gallery.html?slug=\" + encodeURIComponent(rows[0].slug);\n    } catch (err) {\n      this.setState({ galleryBusy: false, galleryError: (err && err.message) || \"Something went wrong.\" });\n    }\n  };\n\n  onI = key => e => this.setState({ [key]: e.target.value, inquiryError: null });\n\n  submitInquiry = async () => {\n    const s = this.state;\n    if (!s.iName || !s.iEmail) { this.setState({ inquiryError: \"Please add your name and email so we can reply.\" }); return; }\n    this.setState({ inquiryBusy: true, inquiryError: null });\n    try {\n      const res = await fetch(SB_URL + \"/rest/v1/leads\", {\n        method: \"POST\",\n        headers: {\n          \"Content-Type\": \"application/json\",\n          apikey: SB_ANON_KEY,\n          Authorization: \"Bearer \" + SB_ANON_KEY,\n          Prefer: \"return=minimal\"\n        },\n        body: JSON.stringify({\n          name: s.iName, email: s.iEmail, phone: s.iPhone, address: s.iAddress,\n          service_type: s.iService, message: s.iMessage\n        })\n      });\n      if (!res.ok) {\n        const d = await res.json().catch(() => ({}));\n        throw new Error(d.message || \"Could not send your inquiry. Try again.\");\n      }\n      this.setState({\n        inquiryBusy: false, inquirySent: true,\n        iName: \"\", iEmail: \"\", iPhone: \"\", iAddress: \"\", iService: \"\", iMessage: \"\"\n      });\n    } catch (err) {\n      this.setState({ inquiryBusy: false, inquiryError: (err && err.message) || \"Something went wrong.\" });\n    }\n  };\n\n  renderVals() {\n    const s = this.state;\n    const login = s.mode === \"login\";\n    const tab = (label, key) => ({\n      label, go: () => this.setState({ mode: key, authError: null }),\n      bg: s.mode === key ? \"#111\" : \"#fff\",\n      fg: s.mode === key ? \"#fff\" : \"#6f6c66\"\n    });\n    const notices = {\n      gallery: {\n        title: \"Find your gallery\",\n        body: \"Enter the gallery link or code your photographer sent you. Client galleries aren't listed publicly.\"\n      },\n      inquiry: {\n        title: \"Inquire about a shoot\",\n        body: \"Tell us the address, the listing date, and what you need \u2014 photo, video, drone, or a 3D tour. We reply within a few hours.\"\n      }\n    };\n    const n = s.notice ? notices[s.notice] : null;\n\n    return {\n      authOpen: s.authOpen,\n      authTabs: [tab(\"LOG IN\", \"login\"), tab(\"SIGN UP\", \"signup\")],\n      authKicker: login ? \"WELCOME BACK\" : \"CREATE AN ACCOUNT\",\n      authTitle: login ? \"Log in\" : \"Sign up\",\n      authCta: s.authBusy ? \"PLEASE WAIT\u2026\" : (login ? \"LOG IN\" : \"CREATE ACCOUNT\"),\n      passLabel: login ? \"PASSWORD\" : \"CHOOSE A PASSWORD\",\n      authFoot: login\n        ? \"Staff accounts land in the studio dashboard. Clients go straight to their gallery.\"\n        : \"New here? We'll set up your studio workspace after you confirm your email.\",\n      email: s.email,\n      pass: s.pass,\n      onEmail: e => this.setState({ email: e.target.value }),\n      onPass: e => this.setState({ pass: e.target.value }),\n      openAuth: () => this.setState({ authOpen: true }),\n      closeAuth: () => this.setState({ authOpen: false, authError: null }),\n      authSubmit: this.authSubmit,\n      authError: s.authError,\n      authErrorOpen: !!s.authError,\n\n      openGallery: () => this.setState({ notice: \"gallery\", gallerySlug: \"\", galleryError: null }),\n      openInquiry: () => this.setState({ notice: \"inquiry\", inquiryError: null, inquirySent: false }),\n      closeNotice: () => this.setState({ notice: null, galleryError: null, inquiryError: null, inquirySent: false }),\n      noticeOpen: !!n,\n      noticeTitle: n ? n.title : \"\",\n      noticeBody: n ? n.body : \"\",\n      noticeIsGallery: s.notice === \"gallery\",\n      noticeIsInquiry: s.notice === \"inquiry\",\n\n      gallerySlug: s.gallerySlug,\n      onGallerySlug: this.onGallerySlug,\n      galleryError: s.galleryError,\n      galleryErrorOpen: !!s.galleryError,\n      galleryButtonLabel: s.galleryBusy ? \"SEARCHING\u2026\" : \"FIND GALLERY\",\n      submitGalleryLookup: this.submitGalleryLookup,\n\n      iName: s.iName, onIName: this.onI(\"iName\"),\n      iEmail: s.iEmail, onIEmail: this.onI(\"iEmail\"),\n      iPhone: s.iPhone, onIPhone: this.onI(\"iPhone\"),\n      iAddress: s.iAddress, onIAddress: this.onI(\"iAddress\"),\n      iService: s.iService, onIService: this.onI(\"iService\"),\n      iMessage: s.iMessage, onIMessage: this.onI(\"iMessage\"),\n      inquiryError: s.inquiryError,\n      inquiryErrorOpen: !!s.inquiryError,\n      inquiryButtonLabel: s.inquiryBusy ? \"SENDING\u2026\" : \"SEND INQUIRY\",\n      inquiryFormOpen: !s.inquirySent,\n      inquirySent: s.inquirySent,\n      submitInquiry: this.submitInquiry,\n\n      sessionEmail: s.sessionEmail,\n      loggedOut: !s.sessionEmail,\n      loggedInStaff: !!s.sessionEmail && s.sessionIsStaff,\n      loggedInClient: !!s.sessionEmail && !s.sessionIsStaff,\n      logout: this.logout,\n      goToCrm: () => { window.location.href = \"./crm.html\"; }\n    };\n  }\n}\n<\/script>\n\n\n<\/body><\/html>"</script>
